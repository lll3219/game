<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食物浪费计算器 · 60 种常见食物</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink: #FF2E63; --yellow: #FFD60A; --cyan: #00D9FF;
    --black: #111; --cream: #FFF6E0; --green: #5BC236;
  }
  html, body { min-height: 100%; overflow-x: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--black); background-color: var(--cream);
    background-image: radial-gradient(circle, rgba(255, 46, 99, .18) 2.5px, transparent 2.6px);
    background-size: 22px 22px; padding-bottom: 40px; -webkit-font-smoothing: antialiased;
  }

  /* ============ 顶栏（新版：两行） ============ */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    padding: 12px 22px 14px;
    background: var(--yellow);
    border-bottom: 5px solid var(--black);
  }
  .topbar-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .logo { font-weight: 900; font-size: 19px; letter-spacing: 1px; }
  .counter {
    font-weight: 900; font-size: 14px; background: #fff;
    border: 4px solid var(--black); border-radius: 999px;
    padding: 6px 16px; box-shadow: 4px 4px 0 var(--black);
    white-space: nowrap;
  }
  .counter span { color: var(--pink); font-size: 17px; }

  /* 累计隐藏成本 */
  .waste-summary {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px 12px;
    margin-top: 10px; padding-top: 10px;
    border-top: 3px dashed rgba(0, 0, 0, .25);
    transform-origin: left center;
  }
  .waste-summary .label {
    font-size: 12px; font-weight: 900; letter-spacing: .5px;
    color: #5a4a00; margin-right: 2px;
  }
  .ws-item {
    display: inline-flex; align-items: center; gap: 4px;
    font-weight: 900; font-size: 13px;
    background: #fff; border: 3px solid var(--black);
    border-radius: 999px; padding: 4px 12px;
    box-shadow: 3px 3px 0 var(--black);
    white-space: nowrap;
  }
  .ws-item b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .ws-item.water  b { color: #0090C0; }
  .ws-item.land   b { color: #3B8C1F; }
  .ws-item.carbon b { color: var(--pink); }

  @keyframes summaryPulse {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.025); }
    100% { transform: scale(1); }
  }
  .waste-summary.pulse { animation: summaryPulse .38s ease; }

  /* ============ 主容器 ============ */
  main { max-width: 1160px; margin: 0 auto; padding: 34px 20px 20px; }

  .page-title {
    font-size: clamp(26px, 4.6vw, 44px); font-weight: 900; letter-spacing: 2px;
    text-align: center; line-height: 1.25;
    text-shadow: 4px 4px 0 var(--yellow), 8px 8px 0 var(--black);
  }
  .page-sub {
    margin-top: 26px; text-align: center; font-size: 15px; font-weight: 800; color: #444;
    background: #fff; display: table; margin-left: auto; margin-right: auto;
    padding: 8px 20px; border: 4px solid var(--black); border-radius: 999px;
    box-shadow: 5px 5px 0 var(--black);
  }

  /* 分类筛选 */
  .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
  .filter-btn {
    font-family: inherit; font-weight: 900; font-size: 13.5px; cursor: pointer;
    background: #fff; color: var(--black); border: 4px solid var(--black);
    border-radius: 999px; padding: 8px 18px; box-shadow: 4px 4px 0 var(--black);
    transition: all .12s ease;
  }
  .filter-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--black); }
  .filter-btn.active { background: var(--pink); color: #fff; }
  .filter-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--black); }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 26px; margin-top: 38px;
  }
  .card {
    position: relative; display: block; text-decoration: none; color: var(--black);
    background: #fff; border: 5px solid var(--black); border-radius: 18px;
    padding: 22px 12px 12px; box-shadow: 9px 9px 0 var(--black);
    transition: transform .15s ease, box-shadow .15s ease;
    overflow: hidden; cursor: pointer;
    animation: pop .45s backwards; animation-delay: var(--d, 0s);
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 14px;
    background: var(--c, var(--cyan)); border-bottom: 4px solid var(--black);
  }
  .card:hover { transform: translate(-4px, -4px); box-shadow: 14px 14px 0 var(--pink); }
  .card:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--black); }
  .card.hidden { display: none; }
  .card-cat {
    position: absolute; top: 20px; right: 10px; font-size: 10px; font-weight: 900;
    background: #fff; border: 3px solid var(--black); border-radius: 999px;
    padding: 2px 7px; letter-spacing: .5px;
  }
  .card-svg { height: 128px; display: flex; align-items: center; justify-content: center; margin-top: 12px; }
  .card-svg svg { width: 100%; height: 100%; display: block; }
  .card-name { font-size: 17.5px; font-weight: 900; text-align: center; margin-top: 8px; letter-spacing: .3px; }
  .card-sub { font-size: 11.5px; text-align: center; color: #666; margin-top: 4px; font-weight: 700; }
  .card-badge {
    margin-top: 12px; text-align: center; font-weight: 900; font-size: 12px;
    background: var(--yellow); border: 3px solid var(--black); border-radius: 999px; padding: 4px 0;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(.85) translateY(18px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ============ 详情页 ============ */
  .detail { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .back-btn {
    font-family: inherit; font-weight: 900; font-size: 15px; cursor: pointer;
    background: #fff; color: var(--black); border: 5px solid var(--black);
    border-radius: 999px; padding: 10px 24px; box-shadow: 6px 6px 0 var(--black);
    transition: all .12s ease; margin-bottom: 28px;
  }
  .back-btn:hover { background: var(--yellow); transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--black); }
  .back-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--black); }

  .hero {
    display: flex; align-items: center; gap: 26px; flex-wrap: wrap;
    background: #fff; border: 5px solid var(--black); border-radius: 24px;
    padding: 24px; box-shadow: 10px 10px 0 var(--black);
  }
  .hero-svg { width: 170px; height: 170px; flex: 0 0 auto; }
  .hero-svg svg { width: 100%; height: 100%; display: block; }
  .hero-info h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 900; letter-spacing: 1px; }
  .hero-info p { margin-top: 10px; font-weight: 800; color: #555; font-size: 15px; }
  .tag {
    display: inline-block; margin-top: 16px; background: var(--cyan);
    border: 4px solid var(--black); border-radius: 999px;
    padding: 6px 16px; font-weight: 900; font-size: 13px;
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; margin-top: 28px; }
  .stat {
    position: relative; overflow: hidden; border: 5px solid var(--black);
    border-radius: 20px; padding: 20px; background: #fff;
    box-shadow: 8px 8px 0 var(--black); animation: pop .5s backwards;
  }
  .stat::after {
    content: ''; position: absolute; right: -34px; bottom: -34px;
    width: 130px; height: 130px; border-radius: 50%;
    background-image: radial-gradient(circle, rgba(0, 0, 0, .15) 2.5px, transparent 2.6px);
    background-size: 14px 14px; pointer-events: none;
  }
  .stat.water  { background: #E4FAFF; }
  .stat.land   { background: #EBFFE4; }
  .stat.carbon { background: #FFE9F0; }
  .stat-label { font-weight: 900; font-size: 14px; letter-spacing: 1px; }
  .stat-value { font-size: 40px; font-weight: 900; line-height: 1.15; margin-top: 10px; position: relative; z-index: 1; }
  .stat-unit { font-size: 15px; font-weight: 900; margin-left: 4px; }
  .stat-eq {
    position: relative; z-index: 1; margin-top: 12px; font-size: 13.5px; font-weight: 800;
    background: #fff; border: 3px solid var(--black); border-radius: 10px; padding: 7px 11px; display: inline-block;
  }
  .data-note {
    margin-top: 16px; font-size: 12px; font-weight: 700; color: #666;
    background: #fff; border: 3px dashed var(--black); border-radius: 12px;
    padding: 10px 14px; line-height: 1.65;
  }
  .story {
    margin-top: 28px; background: var(--yellow); border: 5px solid var(--black);
    border-radius: 20px; padding: 24px; box-shadow: 8px 8px 0 var(--black);
  }
  .story h2 { font-size: 21px; font-weight: 900; margin-bottom: 14px; }
  .story h3 { font-size: 17px; font-weight: 900; margin: 20px 0 10px; }
  .story p { font-size: 15.5px; line-height: 1.85; font-weight: 700; }
  .story ul { margin-left: 22px; }
  .story li { margin-bottom: 8px; font-weight: 700; font-size: 14.5px; line-height: 1.6; }
  .throw-btn {
    display: block; width: 100%; margin-top: 28px; font-family: inherit;
    font-size: 20px; font-weight: 900; letter-spacing: 1px; padding: 20px; cursor: pointer;
    background: var(--pink); color: #fff; border: 5px solid var(--black);
    border-radius: 20px; box-shadow: 10px 10px 0 var(--black); transition: all .12s ease;
  }
  .throw-btn:hover { transform: translate(-3px, -3px); box-shadow: 13px 13px 0 var(--black); }
  .throw-btn:active { transform: translate(5px, 5px); box-shadow: 3px 3px 0 var(--black); }

  /* ============ Toast ============ */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 160%);
    max-width: min(92vw, 560px); text-align: center; background: var(--black); color: #fff;
    font-weight: 900; font-size: 14px; line-height: 1.5; padding: 14px 26px; border-radius: 22px;
    border: 4px solid #fff; z-index: 999; transition: transform .32s cubic-bezier(.2, 1.4, .5, 1);
    pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); }

  .foot { text-align: center; font-size: 12.5px; font-weight: 700; color: #777; margin-top: 46px; padding: 0 20px; line-height: 1.7; }

  /* ============ 移动端适配 ============ */
  @media (max-width: 520px) {
    .topbar { padding: 10px 14px 12px; }
    .logo { font-size: 16px; }
    .counter { font-size: 12px; padding: 4px 12px; }
    .counter span { font-size: 15px; }
    .waste-summary { gap: 6px 8px; margin-top: 8px; padding-top: 8px; }
    .waste-summary .label { display: none; }
    .ws-item { font-size: 11.5px; padding: 3px 9px; }
    .ws-item b { font-size: 13px; }

    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .card { padding: 20px 8px 10px; border-width: 4px; box-shadow: 6px 6px 0 var(--black); }
    .card-svg { height: 96px; }
    .card-name { font-size: 14.5px; }
    .card-sub { font-size: 10px; }
    .card-cat { display: none; }
    .hero-svg { width: 130px; height: 130px; }
    .stat-value { font-size: 32px; }
  }

  /* 触摸设备取消 hover 残留 */
  @media (hover: hover) {
    .card:hover { transform: translate(-4px, -4px); box-shadow: 14px 14px 0 var(--pink); }
  }
  * { -webkit-tap-highlight-color: transparent; }
  body { touch-action: manipulation; }
</style>
</head>

<!-- ========== 顶栏：份数 + 累计隐藏成本 ========== -->
<header class="topbar">
  <div class="topbar-row">
    <div class="logo">🍽️ 食物浪费计算器</div>

  </div>
  <div class="waste-summary" id="wasteSummary">

    <span class="ws-item land">🌱 土地 <b id="sumLand">0</b> ㎡</span>
    <span class="ws-item carbon">🌫️ 碳 <b id="sumCarbon">0</b> kg CO₂e</span>
  </div>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>

<footer class="foot">

</footer>

/* =========================================================
   3. 状态
   ========================================================= */
const STORAGE_KEY = 'fw_wasted_v2';
const state = { wasted: loadWasted(), filter: 'all' };

function loadWasted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveWasted() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.wasted)); } catch (e) {}
}

/* =========================================================
   4. 工具函数
   ========================================================= */
function findFood(id) { return FOODS.filter(function (f) { return f.id === id; })[0]; }

function sumResource(key) {
  let total = 0;
  state.wasted.forEach(function (id) {
    const f = findFood(id);
    if (f) total += f[key];
  });
  return total;
}

function animateValue(el, target, decimals, duration) {
  if (!el) return;
  const dur = duration || 900;
  const start = performance.now();
  function frame(now) {
    let p = (now - start) / dur;
    if (p > 1) p = 1;
    const eased = 1 - Math.pow(1 - p, 3);
    const v = target * eased;
    el.textContent = decimals > 0 ? v.toFixed(decimals) : String(Math.round(v));
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = decimals > 0 ? target.toFixed(decimals) : String(Math.round(target));
  }
  requestAnimationFrame(frame);
}

function fmtEq(v) {
  if (v >= 10) return String(Math.round(v));
  return v.toFixed(1).replace(/\.0$/, '');
}

/* 千分位格式化，用于顶栏累计值 */
function fmtNum(n, decimals) {
  const fixed = Number(n).toFixed(decimals);
  const parts = fixed.split('.');
  const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts[1] ? intPart + '.' + parts[1] : intPart;
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ============ 核心：刷新顶栏份数 + 三项累计 ============ */
let summaryPulseTimer = null;
function updateWasteSummary(pulse) {
  // 份数
  const countEl = document.getElementById('wasteCount');
  if (countEl) countEl.textContent = state.wasted.length;

  // 三项累计
  const wEl = document.getElementById('sumWater');
  const lEl = document.getElementById('sumLand');
  const cEl = document.getElementById('sumCarbon');

  if (wEl) wEl.textContent = fmtNum(sumResource('water'), 0);
  if (lEl) lEl.textContent = fmtNum(sumResource('land'), 1);
  if (cEl) cEl.textContent = fmtNum(sumResource('carbon'), 2);

  // 脉冲反馈
  if (pulse) {
    const box = document.getElementById('wasteSummary');
    if (box) {
      box.classList.remove('pulse');
      void box.offsetWidth; // 强制重绘，让动画可重复触发
      box.classList.add('pulse');
      clearTimeout(summaryPulseTimer);
      summaryPulseTimer = setTimeout(function () {
        box.classList.remove('pulse');
      }, 420);
    }
  }
}

/* =========================================================
   5. 渲染
   ========================================================= */
function renderHome() {
  const main = document.getElementById('main');
  if (!main) { console.error('[食物浪费计算器] 找不到 #main'); return; }

  const filtersHtml = CATEGORIES.map(function (c) {
    return '<button type="button" class="filter-btn' + (state.filter === c.id ? ' active' : '') +
           '" data-filter="' + c.id + '">' + c.label + '</button>';
  }).join('');

  const cards = FOODS.map(function (f, i) {
    return '<div class="card" data-food="' + f.id + '" data-cat="' + f.cat + '" ' +
             'style="--c:' + f.color + '; --d:' + (i * 0.02).toFixed(2) + 's">' +
             '<span class="card-cat">' + CAT_LABEL[f.cat] + '</span>' +
             '<div class="card-svg">' + f.svg + '</div>' +
             '<div class="card-name">' + f.name + '</div>' +
             '<div class="card-sub">' + f.desc + '</div>' +
             '<div class="card-badge">查看成本 →</div>' +
           '</div>';
  }).join('');

  main.innerHTML =
    '<section class="home">' +
      '<h1 class="page-title">今天，你要丢掉什么？</h1>' +
      '<p class="page-sub">60 种常见食物 · 点击查看它们的隐藏成本</p>' +
      '<div class="filters">' + filtersHtml + '</div>' +
      '<div class="grid">' + cards + '</div>' +
    '</section>';

  applyFilter();
}

function applyFilter() {
  const cards = document.querySelectorAll('.card[data-food]');
  for (let i = 0; i < cards.length; i++) {
    const cat = cards[i].getAttribute('data-cat');
    if (state.filter === 'all' || state.filter === cat) cards[i].classList.remove('hidden');
    else cards[i].classList.add('hidden');
  }
  const btns = document.querySelectorAll('.filter-btn');
  for (let j = 0; j < btns.length; j++) {
    if (btns[j].getAttribute('data-filter') === state.filter) btns[j].classList.add('active');
    else btns[j].classList.remove('active');
  }
}

function renderDetail(id) {
  const f = findFood(id);
  const main = document.getElementById('main');
  if (!main) { console.error('[食物浪费计算器] 找不到 #main'); return; }
  if (!f) { goHome(); return; }

  const waterEq  = f.water / 40;
  const landEq   = f.land / 0.0624;
  const carbonEq = f.carbon / 0.2;
  const tipsHtml = f.tips.map(function (t) { return '<li>' + t + '</li>'; }).join('');

  main.innerHTML =
    '<section class="detail">' +
      '<button class="back-btn" id="backBtn" type="button">← 返回食物列表</button>' +
      '<div class="hero">' +
        '<div class="hero-svg">' + f.svg + '</div>' +
        '<div class="hero-info">' +
          '<h1>' + f.name + '</h1>' +
          '<p>' + f.desc + '</p>' +
          '<span class="tag">' + CAT_LABEL[f.cat] + ' · 一份食物的隐藏成本</span>' +
        '</div>' +
      '</div>' +
      '<div class="stats">' +
        '<div class="stat water" style="animation-delay:.05s">' +
          '<div class="stat-label">💧 水资源消耗</div>' +
          '<div class="stat-value"><span id="v-water">0</span><span class="stat-unit">升</span></div>' +
          '<div class="stat-eq">≈ 淋浴 ' + fmtEq(waterEq) + ' 次（每次 40 升）</div>' +
        '</div>' +
        '<div class="stat land" style="animation-delay:.12s">' +
          '<div class="stat-label">🌱 土地资源消耗</div>' +
          '<div class="stat-value"><span id="v-land">0</span><span class="stat-unit">㎡</span></div>' +
          '<div class="stat-eq">≈ ' + fmtEq(landEq) + ' 张 A4 纸面积（每张 0.0624㎡）</div>' +
        '</div>' +
        '<div class="stat carbon" style="animation-delay:.19s">' +
          '<div class="stat-label">🌫️ 碳排放</div>' +
          '<div class="stat-value"><span id="v-carbon">0</span><span class="stat-unit">kg CO₂e</span></div>' +
          '<div class="stat-eq">≈ 开车 ' + fmtEq(carbonEq) + ' 公里（每公里 0.2 kg）</div>' +
        '</div>' +
      '</div>' +
      '<div class="data-note">📐 数据说明：水足迹参考 Mekonnen &amp; Hoekstra 全球平均研究，碳足迹参考 Poore &amp; Nemecek (2018)，土地为耕地/牧场占用估算。数值会因产地、季节、加工与运输方式不同而有差异，此处用于科普对比。</div>' +
      '<div class="story">' +
        '<h2>🗑️ 如果这份食物被丢掉……</h2>' +
        '<p>' + f.story + '</p>' +
        '<h3>怎么做更好？</h3>' +
        '<ul>' + tipsHtml + '</ul>' +
      '</div>' +
      '<button class="throw-btn" id="throwBtn" type="button">把它丢进垃圾桶 🗑️</button>' +
    '</section>';

  animateValue(document.getElementById('v-water'), f.water, 0, 850);
  animateValue(document.getElementById('v-land'), f.land, 1, 850);
  animateValue(document.getElementById('v-carbon'), f.carbon, 2, 850);

  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('throwBtn').addEventListener('click', function () {
    state.wasted.push(f.id);
    saveWasted();
    updateWasteSummary(true); // 刷新份数 + 三项累计，并触发脉冲
    showToast('+1 份「' + f.name + '」被浪费 · 累计已更新到顶部');
  });

  window.scrollTo(0, 0);
}

/* =========================================================
   6. 路由
   ========================================================= */
function goHome() {
  history.pushState({ page: 'home' }, '', '#');
  render();
}
function goDetail(id) {
  history.pushState({ page: 'detail', id: id }, '', '#/food/' + id);
  render();
}
function render() {
  const raw = location.hash.replace(/^#/, '');
  const prefix = '/food/';
  try {
    if (raw.indexOf(prefix) === 0) renderDetail(raw.slice(prefix.length));
    else renderHome();
  } catch (err) {
    console.error('[食物浪费计算器] 渲染出错：', err);
    try { renderHome(); } catch (e) {}
  }
  // 每次渲染后同步顶栏（首次进入 / 前进后退 / 刷新都正确）
  updateWasteSummary(false);
}

/* =========================================================
   7. 事件委托
   ========================================================= */
document.addEventListener('click', function (e) {
  const target = e.target;
  const filterBtn = target.closest ? target.closest('.filter-btn') : null;
  if (filterBtn) {
    e.preventDefault();
    const val = filterBtn.getAttribute('data-filter');
    if (val) { state.filter = val; applyFilter(); }
    return;
  }
  const card = target.closest ? target.closest('.card[data-food]') : null;
  if (card) {
    const id = card.getAttribute('data-food');
    if (id) { e.preventDefault(); goDetail(id); }
  }
});

window.addEventListener('popstate', render);

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
else render();
</script>
